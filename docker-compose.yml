# Cadeia:  navegador → caddy (HTTPS) → anubis (prova de trabalho) → web (front + /api) → api → db
#
# Só o Anubis publica porta. A API e o banco ficam na rede interna, alcançáveis
# apenas pelos outros contêineres.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluxocaixa}
      POSTGRES_USER: ${POSTGRES_USER:-fluxo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - dados-do-banco:/var/lib/postgresql/data
    healthcheck:
      # A API só sobe depois que o banco aceita conexão de verdade.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fluxo} -d ${POSTGRES_DB:-fluxocaixa}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Sem "ports": o banco fica só na rede interna do compose. Para abrir o
    # psql da sua máquina, descomente:
    # ports:
    #   - "5432:5432"

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-fluxocaixa};Username=${POSTGRES_USER:-fluxo};Password=${POSTGRES_PASSWORD}
      Jwt__ChaveSecreta: ${JWT_CHAVE:?defina JWT_CHAVE no .env}
      Jwt__MinutosDeValidade: ${JWT_MINUTOS:-60}
      # Atrás de proxy o IP de quem chama vem no X-Forwarded-For; sem isto o
      # limite de tentativas de login contaria todo mundo no mesmo balde.
      AtrasDeProxy: "true"
      # Só é usado quando a tabela de usuários está vazia (primeira subida).
      UsuarioInicial__Email: ${ADMIN_EMAIL:-}
      UsuarioInicial__Senha: ${ADMIN_SENHA:-}
      UsuarioInicial__Nome: ${ADMIN_NOME:-Administrador}
    restart: unless-stopped
    # Sem "ports": quem fala com a API é o nginx do serviço web. Para depurar
    # direto, descomente:
    # ports:
    #   - "5217:8080"

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    restart: unless-stopped

  anubis:
    # Versão fixa, não :latest — os arquivos importados pela política vêm de
    # dentro da imagem e mudam de nome entre versões. Esta é a que foi testada.
    image: ghcr.io/techarohq/anubis:v1.25.0
    depends_on:
      - web
    environment:
      BIND: ":8080"
      TARGET: "http://web:80"
      # O Anubis é o primeiro da fila, sem outro proxy na frente: sem isto ele
      # espera um X-Real-Ip que ninguém põe e responde 500 em tudo.
      USE_REMOTE_ADDRESS: "true"
      # Zeros exigidos no hash. 4 é o padrão; acima de 5 incomoda no celular.
      DIFFICULTY: ${ANUBIS_DIFICULDADE:-4}
      POLICY_FNAME: /etc/anubis/botPolicies.yaml
      # Assina o cookie do desafio. Gere com: openssl rand -hex 32
      ED25519_PRIVATE_KEY_HEX: ${ANUBIS_CHAVE:?defina ANUBIS_CHAVE no .env}
      METRICS_BIND: ":9090"
    volumes:
      - ./anubis/botPolicies.yaml:/etc/anubis/botPolicies.yaml:ro
    restart: unless-stopped
    # Sem "ports": quem atende a internet é o caddy. Para depurar o Anubis sem
    # passar pelo TLS, descomente:
    # ports:
    #   - "8080:8080"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - anubis
    environment:
      # Domínio que aponta para esta máquina. Use "localhost" para experimentar
      # sem domínio (o certificado será local e o navegador vai avisar).
      DOMINIO: ${DOMINIO:-localhost}
      # E-mail usado pelo Let's Encrypt para avisar de renovação. É obrigatório:
      # vazio, a diretiva "email" fica sem argumento e o Caddy não sobe.
      EMAIL_TLS: ${EMAIL_TLS:?defina EMAIL_TLS no .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificados:/data
      - configuracao-caddy:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  dados-do-banco:
  certificados:
  configuracao-caddy:
