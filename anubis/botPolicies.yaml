# Política do Anubis para o Fluxo de Caixa.
#
# O Anubis é a porta de entrada: o navegador resolve uma prova de trabalho antes
# de chegar no front. Ele NÃO substitui o login — a API continua exigindo o
# token JWT e limitando as tentativas de login.
#
# A referência das regras está em https://anubis.techaro.lol/docs/admin/policies

bots:
  # Bots patológicos e domain fronting: recusa direta.
  - import: (data)/bots/_deny-pathological.yaml
  - import: (data)/common/domain-fronting.yaml

  # Robôs de IA/LLM que ignoram robots.txt.
  - import: (data)/meta/ai-block-aggressive.yaml

  # Monitoramento precisa alcançar a saúde da API sem resolver desafio.
  - name: saude-da-api
    path_regex: ^/api/saude$
    action: ALLOW

  - name: favicon
    path_regex: ^/favicon\.(ico|svg)$
    action: ALLOW

  - name: robots-txt
    path_regex: ^/robots\.txt$
    action: ALLOW

  # Todo navegador resolve a prova de trabalho na primeira visita. O cookie
  # emitido vale para as chamadas seguintes, inclusive as do próprio front
  # para /api, que saem da mesma origem.
  - name: navegador
    user_agent_regex: Mozilla
    action: CHALLENGE

# Dificuldade da prova de trabalho: quantos zeros o hash precisa ter.
# 4 é o padrão recomendado; acima de 5 começa a incomodar quem usa celular.
dnsbl: false
