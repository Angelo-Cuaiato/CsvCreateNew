# Política do Anubis para o Fluxo de Caixa.
#
# O Anubis é a porta de entrada: o navegador resolve uma prova de trabalho antes
# de chegar no front. Ele NÃO substitui o login — a API continua exigindo o
# token JWT e limitando as tentativas de login.
#
# As regras valem na ordem em que aparecem: a primeira que casar decide.
#
# ATENÇÃO ao atualizar a imagem do Anubis: os arquivos importados com (data)/
# vêm de dentro dela e mudam de nome entre versões. Por isso o docker-compose.yml
# fixa uma versão em vez de usar :latest. Ao subir de versão, confira se todos
# os imports abaixo ainda existem — o Anubis recusa a subir se algum sumir.
# Referência: https://anubis.techaro.lol/docs/admin/policies

bots:
  # Bots patológicos e raspadores agressivos: recusa direta.
  - import: (data)/bots/_deny-pathological.yaml
  - import: (data)/bots/aggressive-brazilian-scrapers.yaml

  # Robôs de IA/LLM que ignoram robots.txt.
  - import: (data)/meta/ai-block-aggressive.yaml

  # Buscadores legítimos (Google, Bing, DuckDuckGo e afins) passam.
  - import: (data)/crawlers/_allow-good.yaml

  # Rotas que precisam funcionar sempre: .well-known, favicon, robots.txt,
  # sitemap.
  - import: (data)/common/keep-internet-working.yaml

  # Monitoramento precisa alcançar a saúde da API sem resolver desafio.
  - name: saude-da-api
    path_regex: ^/api/saude$
    action: ALLOW

  # Todo navegador resolve a prova de trabalho na primeira visita. O cookie
  # emitido vale para as chamadas seguintes, inclusive as que o front faz para
  # /api, que saem da mesma origem.
  - name: navegador
    user_agent_regex: Mozilla
    action: CHALLENGE
