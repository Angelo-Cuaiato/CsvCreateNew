server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não anuncia a versão do servidor.
    server_tokens off;

    # O Angular é uma aplicação de página única: qualquer rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mesma origem do front, então o navegador não precisa de CORS.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O mesmo teto que a API aceita para o upload da planilha.
        client_max_body_size 20m;

        # Consolidar uma planilha grande pode passar do padrão de 60s.
        proxy_read_timeout 120s;
    }
}
